# CI/CD: kiểm tra frontend + backend; CHỈ deploy khi có tag release.
# - push main / pull request → chỉ chạy test (không deploy)
# - push tag vX.Y.Z (tag phải nằm trên nhánh main) → test → deploy Production lên Vercel → tạo GitHub Release
#   Phát hành:  git tag v1.2.0 && git push origin v1.2.0
# - Vercel không chạy được Spring Boot + MySQL, nên deploy bản "offline-demo" (npm run build:offline) — static, không cần backend.
# Cần cấu hình trên GitHub repo:
#   secrets.VERCEL_TOKEN      — token tạo ở https://vercel.com/account/tokens (scope: team TVT POC)
#   vars.VERCEL_ORG_ID        — team_27eoePqTO0RGEFGCGJM8SOvC
#   vars.VERCEL_PROJECT_ID    — prj_Wj03Wa8T08DCPNGMzQ5geoLV3XKw
name: CI/CD — Vercel

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — typecheck · test · build demo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/booking-hotel-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/booking-hotel-frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build offline demo
        run: npm run build:offline
      - uses: actions/upload-artifact@v4
        with:
          name: offline-demo
          path: src/booking-hotel-frontend/offline-demo/dist
          retention-days: 7

  backend:
    name: Backend — mvn verify (JUnit + Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/booking-hotel-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: ./mvnw -B -ntp verify

  deploy:
    name: Release ${{ github.ref_name }} → Vercel Production
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: write # tạo GitHub Release
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag nằm trên main + cấu hình
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG không nằm trên nhánh main — chỉ phát hành từ main."; exit 1
          fi
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing secrets.VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing vars.VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing vars.VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then echo "::error::Thiếu cấu hình:$missing (Settings → Secrets and variables → Actions)"; exit 1; fi
      - uses: actions/download-artifact@v4
        with:
          name: offline-demo
          path: dist
      - run: npm install -g vercel@latest
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy dist --prod --yes --token "$VERCEL_TOKEN" --meta release="$TAG")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### 🚀 $TAG deployed: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: GitHub Release
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          notes="Production: https://tvt-poc-mini-booking-hotel.vercel.app (deployment: $URL)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG đã có — bỏ qua tạo mới."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --notes "$notes" --verify-tag
          fi
